version: v5.1.4

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gradus-app
    environment:
      DATABASE_URL: postgres://gradus:gradus@postgres:5432/gradus
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - 3000:3000
    depends_on:
      - postgres

  postgres:
    image: postgres:15.3-alpine
    container_name: gradus-postgres
    environment:
      POSTGRES_USER: gradus
      POSTGRES_PASSWORD: gradus
      POSTGRES_DB: gradus
    expose:
      - 5432
    ports:
      - 5432:5432
    volumes:
      - gradus_volume:/var/lib/postgresql/data

volumes:
  gradus_volume:
